name: Bajar años de velas (Alpaca)

# Solo baja y guarda velas de Alpaca, sin entrenar ni tocar el historial.
# Sirve para llenar el guardado la primera vez (tarda hasta una hora) sin cambiar
# el modelo con el que se va a anotar el día.
on:
  workflow_dispatch:

concurrency:
  group: daytrading
  cancel-in-progress: false

jobs:
  bajar:
    runs-on: ubuntu-latest
    timeout-minutes: 180
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
      - run: pip install -r requirements.txt
      - name: Recuperar velas guardadas
        uses: actions/cache/restore@v4
        with:
          path: data/alpaca_5m
          key: alpaca-5m-${{ github.run_id }}
          restore-keys: alpaca-5m-
      - name: Bajar velas de Alpaca
        env:
          ALPACA_API_KEY: ${{ secrets.ALPACA_API_KEY }}
          ALPACA_SECRET_KEY: ${{ secrets.ALPACA_SECRET_KEY }}
        run: python -m agent.alpaca_datos
      - name: Guardar velas para la próxima vez
        if: always()
        uses: actions/cache/save@v4
        with:
          path: data/alpaca_5m
          key: alpaca-5m-${{ github.run_id }}
